  <main>
    <h2>Bizimle İletişime Geçin</h2>
    
    <div class="form-kapsayici">
      <form action="#" method="post" onsubmit="alert('Mesajınız başarıyla gönderildi!');">
        
        <div class="form-grup">
          <label for="adsoyad">Adınız Soyadınız:</label>
          <input type="text" id="adsoyad" name="adsoyad" required>
        </div>

        <div class="form-grup">
          <label for="eposta">E-Posta Adresiniz:</label>
          <input type="email" id="eposta" name="eposta" required>
        </div>

        <div class="form-grup">
          <label for="mesaj">Mesajınız:</label>
          <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
        </div>

        <button type="submit" class="buton">Gönder</button>
        
      </form>
    </div>
  </main>
